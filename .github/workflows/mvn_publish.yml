name: Maven Publish

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase

      - name: Assert validation-only upload
        run: |
          python3 - <<'PY_CHECK'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          pom = ET.parse('java/pom.xml').getroot()
          assert pom.findtext('m:version', namespaces=ns) == '0.16.0'
          plugins = pom.findall('.//m:plugin', ns)
          central = [p for p in plugins if p.findtext('m:artifactId', namespaces=ns) == 'central-publishing-maven-plugin']
          assert len(central) == 1
          assert central[0].findtext('m:configuration/m:autoPublish', namespaces=ns) == 'false'
          assert central[0].findtext('m:configuration/m:waitUntil', namespaces=ns) == 'validated'
          print('Confirmed: upload and validate only; automatic publication disabled')
          PY_CHECK

      - name: Check Central authentication
        run: |
          python3 - <<'PY_AUTH'
          import base64, os, urllib.request, urllib.error, uuid
          username = os.environ['MAVEN_USERNAME']
          password = os.environ['MAVEN_CENTRAL_TOKEN']
          for label, value in [('username', username), ('token', password)]:
              print(label + '_present=' + str(bool(value)))
              print(label + '_edge_whitespace=' + str(value != value.strip()))
              print(label + '_contains_newline=' + str('\n' in value or '\r' in value))
          try:
              combined = b':' in base64.b64decode(password, validate=True)
          except Exception:
              combined = False
          print('token_is_base64_username_password_pair=' + str(combined))
          url = 'https://central.sonatype.com/api/v1/publisher/status?id=' + str(uuid.uuid4())
          def probe(label, u, p):
              header = base64.b64encode((u+':'+p).encode()).decode()
              request = urllib.request.Request(url, method='POST', headers={'Authorization': 'Bearer '+header})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              print(label + '_HTTP_STATUS=' + str(status))
          probe('stored_credentials', username, password)
          if username != username.strip() or password != password.strip():
              probe('trimmed_credentials', username.strip(), password.strip())
          PY_AUTH
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
