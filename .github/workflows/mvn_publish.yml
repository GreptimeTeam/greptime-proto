name: Maven Publish

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase

      - name: Assert validation-only upload
        run: |
          python3 - <<'PY_CHECK'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          pom = ET.parse('java/pom.xml').getroot()
          assert pom.findtext('m:version', namespaces=ns) == '0.16.0'
          plugins = pom.findall('.//m:plugin', ns)
          central = [p for p in plugins if p.findtext('m:artifactId', namespaces=ns) == 'central-publishing-maven-plugin']
          assert len(central) == 1
          assert central[0].findtext('m:configuration/m:autoPublish', namespaces=ns) == 'false'
          assert central[0].findtext('m:configuration/m:waitUntil', namespaces=ns) == 'validated'
          print('Confirmed: upload and validate only; automatic publication disabled')
          PY_CHECK

      - name: Build with Maven
        run: |
          cd java
          mvn clean deploy --batch-mode -DskipTests -P release -B -U -e
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
