[package]
name = "greptime-proto-xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned: the checked-in bindings are generated by this exact version. 0.14.8 adds a blanket
# Clippy allowance to every generated protobuf type, so an unpinned `0.14` requirement now
# rewrites unrelated bindings and CI's `make all` diff check fails on files a PR never touched.
tonic-prost-build = "=0.14.6"
