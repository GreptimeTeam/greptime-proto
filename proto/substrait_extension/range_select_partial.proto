syntax = "proto3";

package substrait_extension;

option go_package = "github.com/GreptimeTeam/greptime-proto/go/substrait_extension";

message RangeSelectPartial {
  oneof payload {
    RangeSelectPartialV1 v1 = 1;
  }
}

message RangeSelectPartialV1 {
  // This Partial wire contract intentionally has no FILL or Final fields.
  // Alignment interval in milliseconds. Consumers must validate that it is in
  // the range [1, INT64_MAX].
  uint64 align_millis = 1;
  // Alignment origin in milliseconds.
  sint64 align_to_millis = 2;
  // Index of the time column in the Partial direct input Projection schema.
  uint64 time_column_index = 3;
  // Indices of grouping columns in the Partial direct input Projection schema.
  repeated uint64 by_column_indices = 4;
  // Range functions to evaluate. This list must be non-empty and its order defines
  // the derived __range_state_i column order. Consumers must validate that every
  // range is in [1, INT64_MAX] and reject unspecified or unknown aggregate kinds.
  repeated RangeFunctionV1 range_functions = 5;
  // V1 senders must emit 1; consumers must reject 0, unknown, or unsupported
  // versions. This versions the serialized aggregate accumulator state schema
  // exchanged between Partial and Final.
  uint32 state_abi_version = 6;
}

message RangeFunctionV1 {
  // Aggregate function to evaluate. Unspecified and unknown values must be rejected.
  AggregateKind aggregate = 1;
  // Index of the post-coercion materialized function argument in the Partial
  // direct input Projection schema.
  uint64 argument_column_index = 2;
  // Range in milliseconds. Consumers must validate that it is in [1, INT64_MAX].
  uint64 range_millis = 3;
}

enum AggregateKind {
  AGGREGATE_KIND_UNSPECIFIED = 0;
  AGGREGATE_KIND_MIN = 1;
  AGGREGATE_KIND_MAX = 2;
  AGGREGATE_KIND_SUM = 3;
  AGGREGATE_KIND_COUNT = 4;
  AGGREGATE_KIND_AVG = 5;
}

// RangeSelectPartialV1 may evolve only through additive fields that preserve V1
// semantics. Semantic changes require a new RangeSelectPartial payload version.
