syntax = "proto3";

package greptime.v1.region;

import "greptime/v1/common.proto";
import "greptime/v1/row.proto";

option go_package = "github.com/GreptimeTeam/greptime-proto/go/greptime/v1/region";
option java_outer_classname = "Sketch";
option java_package = "io.greptime.v1.region";

// Bounded event-time interval [start, end). Unknown units are rejected.
message SketchTimeRange {
  int64 start = 1;
  int64 end = 2;
  TimeUnit time_unit = 3;
}

// Each query applies to each column. Empty selections are rejected.
message SketchRequest {
  uint64 region_id = 1;
  SketchTimeRange time_range = 2;
  repeated string columns = 3;
  repeated SketchQuery queries = 4;
  // Absent means all candidate files are read.
  SketchSampling sampling = 5;
}

// Uniform file sampling without replacement, before reading index payloads.
message SketchSampling {
  uint32 max_files = 1;
  uint64 seed = 2;
}

// Sampling diagnostics for this request interval. Rows remain sample counts.
message SketchSample {
  uint64 candidate_files = 1;
  uint64 sampled_files = 2;
  // Stable membership signature; changes invalidate comparisons across requests.
  uint64 fingerprint = 3;
  // Sum of squared per-file represented rows in the requested interval.
  double rows_squared_sum = 4;
  uint64 max_file_rows = 5;
}

message SketchDistinctCountQuery {}
message SketchQuantileQuery {
  // Finite fraction in [0, 1].
  double fraction = 1;
}
message SketchFrequencyQuery {
  Value value = 1;
}
message SketchRankQuery {
  // Estimates the fraction of non-null values strictly less than this value.
  Value value = 1;
}
message SketchQuery {
  oneof query {
    SketchDistinctCountQuery distinct_count = 1;
    SketchQuantileQuery quantile = 2;
    SketchFrequencyQuery frequency = 3;
    SketchRankQuery rank = 4;
  }
}

message SketchBucket {
  SketchTimeRange time_range = 1;
  uint64 covered_files = 2;
  uint64 missing_files = 3;
  // Physical rows, including nulls, without deduplication across SSTs.
  uint64 represented_rows = 4;
}

enum SketchGapReason {
  SKETCH_GAP_REASON_UNSPECIFIED = 0;
  SKETCH_GAP_REASON_NOT_CONFIGURED = 1;
  SKETCH_GAP_REASON_MISSING_INDEX = 2;
  SKETCH_GAP_REASON_LEGACY_FORMAT = 3;
  SKETCH_GAP_REASON_SCOPE_MISMATCH = 4;
  SKETCH_GAP_REASON_INCOMPATIBLE = 5;
}
message SketchGap {
  uint64 source_region_id = 1;
  // UUID encoded as exactly 16 bytes.
  bytes file_id = 2;
  uint64 index_version = 3;
  SketchGapReason reason = 4;
}

message SketchDistinctCount {
  double estimate = 1;
  // Relative standard error, not a worst-case bound.
  double relative_standard_error = 2;
}
message SketchQuantile {
  Value value = 1;
}
message SketchFrequency {
  uint64 lower = 1;
  uint64 upper = 2;
}
message SketchRank {
  double fraction = 1;
}
message SketchValue {
  oneof value {
    SketchDistinctCount distinct_count = 1;
    SketchQuantile quantile = 2;
    SketchFrequency frequency = 3;
    SketchRank rank = 4;
  }
}
message ColumnSketchResult {
  string column_name = 1;
  uint32 column_id = 2;
  SketchQuery query = 3;
  repeated SketchBucket buckets = 4;
  repeated SketchGap gaps = 5;
  // Absent for stat requests or when no usable estimate exists.
  SketchValue value = 6;
}
// Results are ordered by request column, then request query.
// Statistics cover persisted physical rows, not the current logical distribution.
message SketchResponse {
  repeated ColumnSketchResult results = 1;
  // Present only when file sampling was requested.
  SketchSample sample = 2;
}
